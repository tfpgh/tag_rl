[project]
name = "tag-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "distrax>=0.1.7",
    "flax>=0.12.4",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "optax>=0.2.6",
    "pynput>=1.8.1",
    "rich>=14.3.2",
    "setuptools==81.0.0",
    "tensorboard>=2.20.0",
    "tensorboard-plugin-profile>=2.21.6",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda12]>=0.9.0.1",
    "mujoco-warp",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pybind11-stubgen>=2.5.5",
]

[tool.pyright]
stubPath = ".typings/"

[tool.uv.sources]
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp.git" }
